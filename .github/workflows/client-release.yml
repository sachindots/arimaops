name: Client Release (Desktop & Android)

on:
  push:
    tags: ["client-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: Client Rust Check & Tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install Linux WebKitGTK system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: cargo test --manifest-path apps/client/src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path apps/client/src-tauri/Cargo.toml --all-targets -- -D warnings

  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux
          - os: macos-latest
            target: macos
          - os: windows-latest
            target: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux bundle dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install Tauri CLI v2
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build desktop artifacts
        working-directory: apps/client
        run: cargo tauri build
      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arimaops-client-${{ matrix.target }}
          path: |
            apps/client/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/client/src-tauri/target/release/bundle/deb/*.deb
            apps/client/src-tauri/target/release/bundle/dmg/*.dmg
            apps/client/src-tauri/target/release/bundle/msi/*.msi
            apps/client/src-tauri/target/release/bundle/nsis/*.exe

  build-android:
    name: Build Android APK
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Install Android NDK
        run: |
          yes | sdkmanager --install "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Install Tauri CLI v2
        run: cargo install tauri-cli --version "^2" --locked
      - name: Initialize & build Android APK
        working-directory: apps/client
        run: |
          cargo tauri android build --apk
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: arimaops-client-android
          path: apps/client/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
