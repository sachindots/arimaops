name: Release

# Push a tag like v0.8.0 to publish a GitHub release with the packed tarball,
# SHA256SUMS and a signed build-provenance attestation (Sigstore, via GitHub).
# Verify a download: sha256sum -c SHA256SUMS
#                    gh attestation verify arimaops-<version>.tgz --repo <owner>/<repo>

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release
  id-token: write # sign the attestation
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The tag matches package.json
        run: |
          v="$(node -p "require('./package.json').version")"
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but package.json says $v"; exit 1; }
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high
      - run: pnpm build
      - name: Tests
        run: |
          for t in auth limits inbox scope findings planner env usage loopguard persona office accounts credentials users rename; do
            npx tsx "scripts/$t-test.ts"
          done
      - name: Pack
        run: mkdir -p pack && npm pack --ignore-scripts --pack-destination pack
      - name: Install and run like a new user
        run: node scripts/smoke-test.mjs pack/*.tgz 7431
      - name: Checksums
        working-directory: pack
        run: sha256sum *.tgz > SHA256SUMS && cat SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: pack/*.tgz
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" pack/*.tgz pack/SHA256SUMS --title "ArimaOps $GITHUB_REF_NAME" --generate-notes --verify-tag
