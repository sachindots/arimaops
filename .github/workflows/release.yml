name: Release

# Push a tag like v2.0.0 to build & push the v2 HQ container image and attach install.sh, compose.yaml,
# SHA256SUMS, and signed build-provenance attestations to the GitHub release.
# Verify a download: sha256sum -c SHA256SUMS
#                    gh attestation verify install.sh --repo <owner>/<repo>

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE: ghcr.io/sachindots/arimaops-v2

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Check tag matches package.json
        run: |
          v="$(node -p "require('./package.json').version")"
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but package.json says $v"; exit 1; }
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/hq.v2.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Prepare installer artifacts
        run: |
          mkdir -p dist-release
          cp install.sh compose.yaml dist-release/
          chmod +x dist-release/install.sh
          (cd dist-release && sha256sum install.sh compose.yaml > SHA256SUMS && cat SHA256SUMS)
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist-release/install.sh,dist-release/compose.yaml
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist-release/install.sh dist-release/compose.yaml dist-release/SHA256SUMS --title "ArimaOps $GITHUB_REF_NAME" --generate-notes --verify-tag
