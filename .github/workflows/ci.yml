name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Build once per OS, then install the packed tarball like a new user and start HQ.
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22]
        include:
          - os: ubuntu-latest
            node: 24
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit (shipped packages, high and critical)
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: pnpm audit --prod --audit-level high
      - run: pnpm build
      - name: Tests (every scripts/*-test.ts)
        run: pnpm test
      - name: Pack
        shell: bash
        run: mkdir -p pack && npm pack --ignore-scripts --pack-destination pack
      - name: CLI smoke test
        run: node bin/arimaops.mjs --version && node bin/arimaops.mjs --help
      - name: Install and run like a new user
        shell: bash
        run: node scripts/smoke-test.mjs pack/*.tgz 7431
      - if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        uses: actions/upload-artifact@v7
        with:
          name: package
          path: pack/*.tgz

  # A bare Linux with no compilers (no python, make or g++): proves nothing is
  # built from source on install, like a fresh Ubuntu or WSL machine.
  linux-bare:
    needs: build
    runs-on: ubuntu-latest
    container: node:22-bookworm-slim
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: package
          path: pack
      - run: apt-get update -qq && apt-get install -y -qq git >/dev/null
      - run: "! command -v make && ! command -v g++ && ! command -v python3"
      - run: node scripts/smoke-test.mjs pack/*.tgz 7431

  # Known-vulnerability scan of both Rust lockfiles. cargo audit fails on vulnerabilities
  # and only prints warnings for unmaintained or yanked crates.
  rust-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo install cargo-audit --locked
      # RUSTSEC-2023-0071 (rsa timing side channel on private-key operations) comes in through
      # webauthn-rs 0.6 -> crypto-glue, which pins a release candidate with no patched version;
      # HQ only verifies RSA signatures. Remove the ignore when webauthn-rs moves to rsa >= 0.10.0.
      - run: cargo audit --file server-rs/Cargo.lock --ignore RUSTSEC-2023-0071
      - run: cargo audit --file apps/client/src-tauri/Cargo.lock
