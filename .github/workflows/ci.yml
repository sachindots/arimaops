name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit (shipped packages, high and critical)
        run: pnpm audit --prod --audit-level high
      - run: pnpm build
      - name: Tests (every scripts/*-test.ts)
        run: pnpm test

  rust-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup component add clippy
      - run: cargo test --manifest-path server-rs/Cargo.toml --no-fail-fast
      - run: cargo clippy --manifest-path server-rs/Cargo.toml --all-targets -- -D warnings

  rust-tauri:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup component add clippy
      - name: Install Linux WebKitGTK system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: cargo test --manifest-path apps/client/src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path apps/client/src-tauri/Cargo.toml --all-targets -- -D warnings

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: PLAYWRIGHT_PORT=47313 HQ_PORT=47399 pnpm test:e2e

  install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build v2 HQ image
        run: docker build -f docker/hq.v2.Dockerfile -t arimaops-ci:smoke .
      - name: Install and verify /api/health
        run: |
          ARIMA_DIR=/tmp/arima-smoke \
          ARIMA_COMPOSE_SRC="$PWD/compose.yaml" \
          ARIMA_HQ_IMAGE=arimaops-ci:smoke \
          ARIMA_SKIP_PULL=1 \
          HQ_HOST_PORT=17420 \
          HQ_PREVIEW_HOST_PORT=17421 \
          sh ./install.sh
          curl -fsS http://127.0.0.1:17420/api/health
      - name: Clean up smoke stack
        if: always()
        run: docker compose -f /tmp/arima-smoke/compose.yaml down -v || true

  # Known-vulnerability scan of both Rust lockfiles. cargo audit fails on vulnerabilities
  # and only prints warnings for unmaintained or yanked crates.
  rust-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo install cargo-audit --locked
      # RUSTSEC-2023-0071 (rsa timing side channel on private-key operations) comes in through
      # webauthn-rs 0.6 -> crypto-glue, which pins a release candidate with no patched version;
      # HQ only verifies RSA signatures. Remove the ignore when webauthn-rs moves to rsa >= 0.10.0.
      - run: cargo audit --file server-rs/Cargo.lock --ignore RUSTSEC-2023-0071
      - run: cargo audit --file apps/client/src-tauri/Cargo.lock
