name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Build once per OS, then install the packed tarball like a new user and start HQ.
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Session backends (fake agent)
        run: npx tsx scripts/session-backend-test.ts
      - name: Agent clones (line endings)
        run: npx tsx scripts/workspace-test.ts
      - name: Auth (agent tokens, device login, step-up)
        run: npx tsx scripts/auth-test.ts
      - name: Usage-limit detection
        run: npx tsx scripts/limits-test.ts
      - name: Messages survive restarts
        run: npx tsx scripts/inbox-test.ts
      - name: Engagement scope
        run: npx tsx scripts/scope-test.ts
      - name: Findings and plan approval
        run: npx tsx scripts/findings-test.ts
      - name: Task dependencies and messages to you
        run: npx tsx scripts/planner-test.ts
      - name: Agents don't inherit a parent agent session
        run: npx tsx scripts/env-test.ts
      - name: Token usage from CLI logs
        run: npx tsx scripts/usage-test.ts
      - name: Loop guard
        run: npx tsx scripts/loopguard-test.ts
      - name: Personas in role files
        run: npx tsx scripts/persona-test.ts
      - name: Container mode (rules and flags; live proxy when Docker has the image)
        run: npx tsx scripts/container-test.ts
      - name: Isometric office (projection and building layout)
        run: npx tsx scripts/office-test.ts
      - name: Account limits test
        run: npx tsx scripts/accounts-test.ts
      - name: Pack
        shell: bash
        run: mkdir -p pack && npm pack --ignore-scripts --pack-destination pack
      - name: CLI smoke test
        run: node bin/jsm-hq.mjs --version && node bin/jsm-hq.mjs --help
      - name: Install and run like a new user
        shell: bash
        run: node scripts/smoke-test.mjs pack/*.tgz 7431
      - if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: pack/*.tgz

  # A bare Linux with no compilers (no python, make or g++): proves nothing is
  # built from source on install, like a fresh Ubuntu or WSL machine.
  linux-bare:
    needs: build
    runs-on: ubuntu-latest
    container: node:22-bookworm-slim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: pack
      - run: apt-get update -qq && apt-get install -y -qq git >/dev/null
      - run: "! command -v make && ! command -v g++ && ! command -v python3"
      - run: node scripts/smoke-test.mjs pack/*.tgz 7431
