# ArimaOps HQ in Docker. On a fresh server:
#   cp deploy/compose.env.example .env   # then edit it
#   docker compose up -d
# Update: docker compose pull && docker compose up -d   (or `build` instead of `pull` from a checkout)
#
# Your home folder is mounted at the same path inside, so HQ's files (~/.arima), sign-ins,
# repos, and the folders it hands to agent containers all keep their real paths.
# Note: agents run in tmux inside this container, so restarting it restarts them.

services:
  hq:
    image: ${ARIMA_IMAGE:-arimaops:latest}
    build:
      context: .
      dockerfile: docker/hq.Dockerfile
    init: true
    restart: unless-stopped
    # Same as a native install: HQ listens on 127.0.0.1 (reach it with `tailscale serve 7420`),
    # and the Container-mode egress proxy binds the Docker bridge.
    network_mode: host
    user: "${ARIMA_UID:?set ARIMA_UID}:${ARIMA_GID:?set ARIMA_GID}"
    group_add:
      - "${DOCKER_GID:?set DOCKER_GID}"
    environment:
      HOME: ${ARIMA_HOME_DIR:?set ARIMA_HOME_DIR}
      ARIMA_MASTER_KEY: ${ARIMA_MASTER_KEY:?set ARIMA_MASTER_KEY}
      ARIMA_NEO4J_URL: bolt://127.0.0.1:${ARIMA_NEO4J_PORT:-7687}
      ARIMA_NEO4J_PASSWORD: ${ARIMA_NEO4J_PASSWORD:?set ARIMA_NEO4J_PASSWORD}
      ARIMA_NEO4J_BROWSER_URL: ${ARIMA_NEO4J_BROWSER_URL:-}
    volumes:
      - ${ARIMA_HOME_DIR}:${ARIMA_HOME_DIR}
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: ${ARIMA_HOME_DIR}
    depends_on: [neo4j]
    command: ["--repo", "${ARIMA_REPO:?set ARIMA_REPO}", "--port", "${ARIMA_PORT:-7420}", "--remote", "--no-open"]

  # The team's memory (docs/memory-core.md). Neo4j Community is GPLv3 and runs as its own program;
  # HQ only talks to it over Bolt. Both ports bind to this machine only (reach the Browser over Tailscale).
  neo4j:
    image: neo4j:2026.10.2-community
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ARIMA_NEO4J_PORT:-7687}:7687"
      - "127.0.0.1:${ARIMA_NEO4J_HTTP_PORT:-7474}:7474"
    environment:
      NEO4J_AUTH: neo4j/${ARIMA_NEO4J_PASSWORD:?set ARIMA_NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - neo4j-data:/data

volumes:
  neo4j-data:
