# ArimaOps v2.0 — Single-Binary Rust HQ + Preview Proxy Compose Stack
#
# Usage:
#   docker compose -f compose.v2.yaml build
#   docker compose -f compose.v2.yaml up -d
#
# Note: Keeps v1 compose.yaml and ~/.arima/ untouched; v2 data lives in its own volume.

services:
  hq-v2:
    image: ${ARIMA_V2_IMAGE:-arimaops-v2:latest}
    build:
      context: .
      dockerfile: docker/hq.v2.Dockerfile
    container_name: arimaops-hq-v2
    restart: unless-stopped
    environment:
      ARIMA_HOME: /data
      HQ_HOST: 0.0.0.0
      HQ_PORT: "${HQ_PORT:-7420}"
      HQ_PREVIEW_PORT: "${HQ_PREVIEW_PORT:-7421}"
      HQ_TRUST_PROXY: "${HQ_TRUST_PROXY:-false}"
      HQ_PUBLIC_ORIGIN: "${HQ_PUBLIC_ORIGIN:-}"
      HQ_PREVIEW_DOMAIN: "${HQ_PREVIEW_DOMAIN:-}"
      ARIMA_MASTER_KEY: "${ARIMA_MASTER_KEY:-}"
      ARIMA_GITHUB_WEBHOOK_SECRET: "${ARIMA_GITHUB_WEBHOOK_SECRET:-}"
      RUST_LOG: "${RUST_LOG:-info}"
    ports:
      - "127.0.0.1:${ARIMA_V2_PORT:-7430}:7420"
      - "127.0.0.1:${ARIMA_V2_PREVIEW_PORT:-7431}:7421"
    volumes:
      - arima_v2_data:/data
      - ${ARIMA_WORKSPACES_DIR:-./}:/workspaces
    cpus: 4.0
    mem_limit: 4g
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7420/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  arima_v2_data:
